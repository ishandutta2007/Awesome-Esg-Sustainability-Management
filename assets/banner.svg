<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%" style="border-radius: 16px; overflow: hidden;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04130d" />
      <stop offset="45%" stop-color="#08231a" />
      <stop offset="85%" stop-color="#0d3524" />
      <stop offset="100%" stop-color="#051710" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e6fffa" />
      <stop offset="80%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d3c2c" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#07231a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <!-- Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#10b981" stroke-width="0.75" stroke-opacity="0.08" />
    </pattern>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(1.08); }
    }
    @keyframes floatParticle1 {
      0%, 100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      50% { transform: translateY(-15px) translateX(10px); opacity: 0.7; }
    }
    @keyframes floatParticle2 {
      0%, 100% { transform: translateY(0px) translateX(0px); opacity: 0.4; }
      50% { transform: translateY(12px) translateX(-8px); opacity: 0.8; }
    }
    @keyframes sweepBeam {
      0% { transform: translateX(-400px); opacity: 0; }
      30% { opacity: 0.35; }
      70% { opacity: 0.35; }
      100% { transform: translateX(1400px); opacity: 0; }
    }
    @keyframes gentleFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    .pulsing-orb-1 {
      animation: pulseGlow 7s ease-in-out infinite;
      transform-origin: 250px 150px;
    }
    .pulsing-orb-2 {
      animation: pulseGlow 9s ease-in-out infinite reverse;
      transform-origin: 950px 220px;
    }
    .particle-1 { animation: floatParticle1 6s ease-in-out infinite; }
    .particle-2 { animation: floatParticle2 8s ease-in-out infinite; }
    .beam { animation: sweepBeam 9s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    .float-card { animation: gentleFloat 5s ease-in-out infinite; }
  </style>

  <!-- Base Canvas -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Animated Ambient Glows (Background Only) -->
  <circle class="pulsing-orb-1" cx="240" cy="140" r="180" fill="url(#glowGrad1)" />
  <circle class="pulsing-orb-2" cx="960" cy="200" r="220" fill="url(#glowGrad2)" />

  <!-- Animated Tech Particles (Background Only) -->
  <circle class="particle-1" cx="180" cy="90" r="3.5" fill="#34d399" />
  <circle class="particle-2" cx="320" cy="280" r="2.5" fill="#06b6d4" />
  <circle class="particle-1" cx="880" cy="80" r="3" fill="#6ee7b7" />
  <circle class="particle-2" cx="1040" cy="290" r="4" fill="#10b981" />
  <circle class="particle-1" cx="620" cy="380" r="2.5" fill="#a7f3d0" />

  <!-- Sweeping Light Beam (Background Only) -->
  <g class="beam" opacity="0.3">
    <line x1="0" y1="0" x2="350" y2="420" stroke="url(#titleGrad)" stroke-width="2" stroke-opacity="0.4" />
  </g>

  <!-- Decorative Circuit / Leaf Lines in Back -->
  <path d="M 50 350 Q 200 280 350 330 T 700 310 T 1150 360" fill="none" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.18" stroke-dasharray="6,6" />
  <path d="M 80 80 Q 300 40 500 100 T 950 50 T 1120 110" fill="none" stroke="#06b6d4" stroke-width="1.2" stroke-opacity="0.15" stroke-dasharray="4,4" />

  <!-- Card Badges / Indicators (Positioned safely below the title text, with subtle float) -->
  <g class="float-card" transform="translate(0, 0)">
    <!-- Pill 1 -->
    <g transform="translate(100, 310)">
      <rect width="210" height="52" rx="12" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.4" filter="url(#shadow)" />
      <text x="24" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#34d399">📊</text>
      <text x="52" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#e6fffa">CSRD &amp; ESRS Compliance</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(330, 310)">
      <rect width="210" height="52" rx="12" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.4" filter="url(#shadow)" />
      <text x="24" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#34d399">🌿</text>
      <text x="52" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#e6fffa">Scope 1, 2, 3 Emissions</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(560, 310)">
      <rect width="210" height="52" rx="12" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.4" filter="url(#shadow)" />
      <text x="24" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#34d399">📉</text>
      <text x="52" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#e6fffa">Decarbonization Planning</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(790, 310)">
      <rect width="310" height="52" rx="12" fill="url(#cardGrad)" stroke="#06b6d4" stroke-width="1.2" stroke-opacity="0.4" filter="url(#shadow)" />
      <text x="22" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#38bdf8">⚡</text>
      <text x="50" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#e6fffa">SaaS Platforms &amp; Open Source</text>
    </g>
  </g>

  <!-- FOREGROUND LAYER: Title and Subtitles (Completely in foreground, high contrast, clean backdrop) -->
  <g id="foreground-content" transform="translate(100, 0)">
    <!-- Top Pill Category -->
    <g transform="translate(0, 52)">
      <rect width="300" height="30" rx="15" fill="#064e3b" fill-opacity="0.75" stroke="#10b981" stroke-width="1.2" />
      <circle cx="16" cy="15" r="4" fill="#34d399" />
      <text x="28" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#a7f3d0" letter-spacing="1.5">CURATED CLIMATE TECH DIRECTORY</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="145" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="url(#titleGrad)" letter-spacing="-0.5" filter="url(#shadow)">
      Awesome ESG &amp; Sustainability
    </text>
    <text x="0" y="195" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="800" fill="#34d399" letter-spacing="-0.5" filter="url(#shadow)">
      Management Ecosystem
    </text>

    <!-- Subtitle -->
    <text x="0" y="242" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400" fill="#cbd5e1" filter="url(#shadow)">
      A comprehensive index of top-tier SaaS platforms and auditable open-source tooling for
    </text>
    <text x="0" y="268" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="500" fill="#94a3b8" filter="url(#shadow)">
      enterprise carbon accounting, CSRD/ESRS reporting, and science-based decarbonization pathways.
    </text>
  </g>

  <!-- Sleek Border -->
  <rect x="1" y="1" width="1198" height="418" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="2" />
</svg>
